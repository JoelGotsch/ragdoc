# Pre-commit hooks for ragdoc. Install once with:
#   uv run pre-commit install
# Run against all files:
#   uv run pre-commit run --all-files
# The basedpyright hook is gated to the `manual` stage (it is slow); run it with:
#   uv run pre-commit run --hook-stage manual basedpyright --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(docx|xlsx|pdf|DOCX)$'
      - id: end-of-file-fixer
        exclude: '\.(docx|xlsx|pdf|DOCX|json)$'
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=15000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      # Lint with autofix.
      - id: ruff
        args: ["--fix"]
      # Format (ruff format, black-compatible).
      - id: ruff-format

  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright (type check)
        entry: uv run basedpyright
        language: system
        types: [python]
        pass_filenames: false
        stages: [manual]
