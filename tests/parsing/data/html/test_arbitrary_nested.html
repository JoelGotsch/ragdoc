<html>
    <head>
        <title>Arbitrary nested document</title>
    </head>
    <body>
        <div class="content">
            <div class="heading">
                <h1>I am a heading but wrapped by tags</h1>
            </div>
            <div class="main">
                <div class="extra_special">
                    <p>Content paragraph structurally separated from its heading by two layers.</p>
                </div>
                <p>Another paragraph structurally disjointed.</p>
            </div>
            <div>Some more text that is, for some reason, in a div.</div>
            <div class="footer">
                <p>Footer content</p>
            </div>
        </div>
    </body>
</html>
