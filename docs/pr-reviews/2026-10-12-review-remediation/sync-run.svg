              <g class="msg" data-k="msg" data-source="head/src/ragdoc/pipeline/sync.py#L223-L243">
                <line x1="556" y1="592" x2="120" y2="592" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#sync-run-sync-run-arrow)"/>
                <rect x="120" y="577" width="280" height="13" fill="#f5f5f5"/>
                <text x="124" y="586" class="sync-run-msg">UpdateResult(processed, skipped, deleted, errors)</text>
              </g>

              <!-- actors -->
              <g class="actor" data-k="actor">
                <rect x="24" y="24" width="192" height="40" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/>
