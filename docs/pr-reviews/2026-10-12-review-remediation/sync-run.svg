<?xml version="1.0" encoding="UTF-8"?>
<svg style="color-scheme: only light" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="sync-run-title sync-run-desc" xmlns="http://www.w3.org/2000/svg" id="sync-run-root">
              <title id="sync-run-title">VectorStorePipeline.run() on one updated source over Qdrant</title>
              <desc id="sync-run-desc">The caller invokes run(paths) on VectorStorePipeline, which hashes the files and hands a SyncPlanInput to SyncEngine. The engine reads the store's source state in one scroll, then for each changed source runs the DocumentPipeline producer under a semaphore, embeds that source's chunks, and calls replace_source on the Qdrant store, which upserts the new points with blank hashes, deletes stale points, and finally stamps the real hashes as a commit marker. The engine returns an UpdateResult.</desc>
              <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #sync-run-root { --color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#bf4520;--font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace }
      #sync-run-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sync-run-root .sync-run-name { font: 600 11px 'Geist', system-ui, sans-serif; fill: #2d3142; }
      #sync-run-root .sync-run-sub { font: 500 9px 'Geist Mono', ui-monospace, monospace; fill: #5a6580; }
      #sync-run-root .sync-run-msg { font: 500 10px 'Geist', system-ui, sans-serif; fill: #2d3142; }
      #sync-run-root .sync-run-msg-accent { font: 600 10px 'Geist', system-ui, sans-serif; fill: #bf4520; }
      #sync-run-root .sync-run-eyebrow { font: 500 7px 'Geist Mono', ui-monospace, monospace; fill: #5a6580; letter-spacing: 0.18em; text-transform: uppercase; }</style>
                <marker id="sync-run-sync-run-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
                <marker id="sync-run-sync-run-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
              </defs>
              <style>
                .sync-run-name { font: 600 11px 'Geist', system-ui, sans-serif; fill: #2d3142; }
                .sync-run-sub { font: 500 9px 'Geist Mono', ui-monospace, monospace; fill: #5a6580; }
                .sync-run-msg { font: 500 10px 'Geist', system-ui, sans-serif; fill: #2d3142; }
                .sync-run-msg-accent { font: 600 10px 'Geist', system-ui, sans-serif; fill: #bf4520; }
                .sync-run-eyebrow { font: 500 7px 'Geist Mono', ui-monospace, monospace; fill: #5a6580; letter-spacing: 0.18em; text-transform: uppercase; }
              </style>
              <rect data-k="bg" x="0" y="0" width="1120" height="620" fill="#f5f5f5"/>

              <!-- lifelines -->
              <line x1="120" y1="64" x2="120" y2="604" stroke="#2d3142" stroke-opacity="0.55" stroke-dasharray="3,3"/>
              <line x1="340" y1="64" x2="340" y2="604" stroke="#2d3142" stroke-opacity="0.55" stroke-dasharray="3,3"/>
              <line x1="560" y1="64" x2="560" y2="604" stroke="#2d3142" stroke-opacity="0.55" stroke-dasharray="3,3"/>
              <line x1="780" y1="64" x2="780" y2="604" stroke="#2d3142" stroke-opacity="0.55" stroke-dasharray="3,3"/>
              <line x1="1000" y1="64" x2="1000" y2="604" stroke="#2d3142" stroke-opacity="0.55" stroke-dasharray="3,3"/>

              <!-- fragment: per changed source -->
              <rect x="528" y="264" width="572" height="300" rx="8" fill="none" stroke="#2d3142" stroke-opacity="0.55" stroke-dasharray="4,3"/>
              <rect x="572" y="268" width="284" height="11" fill="#f5f5f5"/>
              <text x="576" y="276" class="sync-run-eyebrow">loop · per changed source, ≤ concurrency at a time</text>

              <!-- activation bars -->
              <rect x="336" y="96" width="8" height="476" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
              <rect x="556" y="176" width="8" height="412" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
              <rect x="776" y="296" width="8" height="42" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
              <rect x="996" y="212" width="8" height="16" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
              <rect x="996" y="412" width="8" height="140" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>

