                <line x1="120" y1="100" x2="336" y2="100" stroke="#4f5d75" stroke-width="1" marker-end="url(#sync-run-sync-run-arrow)"/>
                <text x="124" y="94" class="sync-run-msg">run(paths)</text>
              </g>
              <g class="msg" data-k="msg" data-source="head/src/ragdoc/pipeline/sync.py#L260-L325">
                <path d="M344,130 H384 V150 H348" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#sync-run-sync-run-arrow)"/>
                <rect x="386" y="135" width="312" height="13" fill="#f5f5f5"/>
                <text x="390" y="145" class="sync-run-msg">_resolve: hash files in threads; unreadable → pre_failed</text>
              </g>
              <g class="msg" data-k="msg" data-source="head/src/ragdoc/pipeline/sync.py#L481-L523">
                <line x1="344" y1="180" x2="556" y2="180" stroke="#4f5d75" stroke-width="1" marker-end="url(#sync-run-sync-run-arrow)"/>
                <text x="348" y="174" class="sync-run-msg">run(SyncPlanInput, delete_orphans)</text>
              </g>
              <g class="msg" data-k="msg" data-source="head/src/ragdoc/integrations/_qdrant_base.py#L170-L200">
                <line x1="564" y1="216" x2="996" y2="216" stroke="#4f5d75" stroke-width="1" marker-end="url(#sync-run-sync-run-arrow)"/>
                <rect x="564" y="201" width="380" height="13" fill="#f5f5f5"/>
                <text x="568" y="210" class="sync-run-msg">list_source_state() → {source_id: SourceState}; mixed hashes ⇒ blank</text>
              </g>
              <g class="msg" data-k="msg" data-source="head/src/ragdoc/pipeline/sync.py#L390-L450">
                <line x1="564" y1="300" x2="776" y2="300" stroke="#4f5d75" stroke-width="1" marker-end="url(#sync-run-sync-run-arrow)"/>
                <rect x="564" y="285" width="390" height="13" fill="#f5f5f5"/>
                <text x="568" y="294" class="sync-run-msg">producer(src) under the semaphore; slot held until the writer takes it</text>
              </g>
              <g class="msg" data-k="msg" data-source="head/src/ragdoc/pipeline/vectorstore.py#L208-L227">
                <line x1="776" y1="334" x2="564" y2="334" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#sync-run-sync-run-arrow)"/>
                <text x="772" y="328" class="sync-run-msg" text-anchor="end">SourceChange[Chunk] + file source_hash</text>
              </g>
              <g class="msg" data-k="msg" data-source="head/src/ragdoc/pipeline/vectorstore.py#L381-L394">
                <path d="M564,364 H604 V384 H568" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#sync-run-sync-run-arrow)"/>
                <rect x="606" y="369" width="230" height="13" fill="#f5f5f5"/>
                <text x="610" y="379" class="sync-run-msg">pre_write(items): embed this source only</text>
              </g>
              <g class="msg" data-k="msg" data-source="head/src/ragdoc/pipeline/sync.py#L589-L611">
                <line x1="564" y1="416" x2="996" y2="416" stroke="#bf4520" stroke-width="1.2" marker-end="url(#sync-run-sync-run-arrow-accent)"/>
                <rect x="564" y="401" width="404" height="13" fill="#f5f5f5"/>
                <text x="568" y="410" class="sync-run-msg-accent">replace_source(source_id, chunks): the store satisfies SourceReplaceStore</text>
              </g>
              <g class="msg" data-k="msg" data-source="head/src/ragdoc/integrations/_qdrant_base.py#L304-L330">
                <path d="M996,448 H956 V468 H992" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#sync-run-sync-run-arrow)"/>
                <rect x="576" y="453" width="378" height="13" fill="#f5f5f5"/>
                <text x="950" y="463" class="sync-run-msg" text-anchor="end">1 · upsert new points, hashes blank (rollback created ids on failure)</text>
              </g>
              <g class="msg" data-k="msg" data-source="head/src/ragdoc/integrations/_qdrant_base.py#L262-L289">
                <path d="M996,488 H956 V508 H992" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#sync-run-sync-run-arrow)"/>
                <rect x="660" y="493" width="294" height="13" fill="#f5f5f5"/>
                <text x="950" y="503" class="sync-run-msg" text-anchor="end">2 · delete stale points: same source_id, id ∉ new ids</text>
              </g>
              <g class="msg" data-k="msg" data-source="head/src/ragdoc/integrations/_qdrant_base.py#L350-L367">
                <path d="M996,528 H956 V548 H992" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#sync-run-sync-run-arrow-accent)"/>
                <rect x="676" y="533" width="278" height="13" fill="#f5f5f5"/>
                <text x="950" y="543" class="sync-run-msg-accent" text-anchor="end">3 · set_payload real hashes by id (commit marker)</text>
