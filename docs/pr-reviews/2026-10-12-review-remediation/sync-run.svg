                <text x="340" y="54" class="sync-run-sub" text-anchor="middle">pipeline/vectorstore.py</text>
              </g>
              <g class="actor" data-k="actor">
                <rect x="464" y="24" width="192" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
                <text x="560" y="41" class="sync-run-name" text-anchor="middle">SyncEngine[Chunk]</text>
                <text x="560" y="54" class="sync-run-sub" text-anchor="middle">pipeline/sync.py</text>
              </g>
              <g class="actor" data-k="actor">
                <rect x="684" y="24" width="192" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
                <text x="780" y="41" class="sync-run-name" text-anchor="middle">DocumentPipeline</text>
                <text x="780" y="54" class="sync-run-sub" text-anchor="middle">producer · pipeline/linear.py</text>
              </g>
              <g class="actor" data-k="actor">
                <rect x="904" y="24" width="192" height="40" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
                <text x="1000" y="41" class="sync-run-name" text-anchor="middle">QdrantVectorStore</text>
                <text x="1000" y="54" class="sync-run-sub" text-anchor="middle">integrations/_qdrant_base.py</text>
