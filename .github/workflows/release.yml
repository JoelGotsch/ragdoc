name: Release

on:
  release:
    types: [published]

# NOTE: ragdoc is proprietary-licensed (see pyproject.toml). This workflow
# builds the distribution and attaches it to the GitHub release. It does NOT
# publish to public PyPI. To publish to an internal index, uncomment and
# configure the `publish` job below with the appropriate registry + secrets.

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Build sdist and wheel
        run: uv build

      - name: Upload dist as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Attach distribution to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

